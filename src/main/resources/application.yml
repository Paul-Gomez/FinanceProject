spring:
  application:
    name: fincore

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fincore}
    username: ${DB_USER:fincore}
    password: ${DB_PASSWORD:fincore}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

fincore:
  security:
    # Sin valor por defecto a propósito: si no se define JWT_SECRET la aplicación no arranca.
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
    rate-limit:
      auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap:
    # Email de un usuario ya registrado al que dar el rol ADMIN al arrancar (vacío = ninguno).
    admin-email: ${ADMIN_EMAIL:}
  jobs:
    enabled: ${JOBS_ENABLED:true}
    reminder-days: 3
    overdue-bills-cron: "0 5 0 * * *"
    reminders-cron: "0 0 8 * * *"
    cleanup-cron: "0 30 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: fincore

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    com.fincore: INFO
