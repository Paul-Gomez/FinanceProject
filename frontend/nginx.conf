server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Mismo origen para la SPA y la API: el navegador no necesita CORS.
    location /api/ {
        proxy_pass http://app:8080;
        # $http_host conserva el puerto (localhost:3000). Con $host Spring vería
        # "localhost" sin puerto, tomaría la petición como de otro origen y el
        # filtro de CORS la rechazaría con un 403.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Importaciones CSV de hasta 5 MB (el mismo límite que el backend).
        client_max_body_size 5m;
    }

    # Los ficheros con hash en el nombre no cambian nunca: caché larga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta (/transactions, /budgets...) la resuelve React Router.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
        add_header X-Frame-Options "DENY";
        try_files $uri /index.html;
    }
}
