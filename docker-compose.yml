services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fincore}
      POSTGRES_USER: ${DB_USER:-fincore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fincore}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - fincore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fincore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fincore}
      DB_USER: ${DB_USER:-fincore}
      DB_PASSWORD: ${DB_PASSWORD:-fincore}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el fichero .env (al menos 32 caracteres)}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # La web: nginx sirve la SPA de React y reenvía /api al servicio "app".
  web:
    build: ./frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  fincore_postgres_data:
