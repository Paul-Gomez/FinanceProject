services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fincore}
      POSTGRES_USER: ${DB_USER:-fincore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fincore}
    ports:
      - "5432:5432"
    volumes:
      - fincore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fincore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fincore}
      DB_USER: ${DB_USER:-fincore}
      DB_PASSWORD: ${DB_PASSWORD:-fincore}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"

volumes:
  fincore_postgres_data:
